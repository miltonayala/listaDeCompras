<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lista de Supermercado — Milton</title>
  <style>
    :root {
      --bg: #f2f2f6;
      --card: #ffffff;
      --muted: #8e8e93;
      --accent: #007aff;
      --radius: 16px;
      --glass: rgba(255, 255, 255, 0.6);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, #f7f7fb 0%, var(--bg) 100%);
      color: #111
    }

    .wrap {
      max-width: 820px;
      margin: 18px auto;
      padding: 16px
    }

    .top {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      overflow: hidden;
      flex: 0 0 64px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08)
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    h1 {
      font-size: 20px;
      margin: 0
    }

    p.lead {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px
    }

    .card {
      margin-top: 14px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: 0 6px 24px rgba(10, 10, 20, 0.06)
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px
    }

    button {
      background: transparent;
      border: 1px solid rgba(0, 0, 0, 0.06);
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 600
    }

    .accent {
      background: linear-gradient(180deg, var(--accent), #0062d6);
      color: white;
      border: 0
    }

    .muted {
      color: var(--muted);
      border: 1px solid rgba(0, 0, 0, 0.04)
    }

    ul.checklist {
      list-style: none;
      padding: 8px;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px
    }

    li.item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.03)
    }

    .checkbox {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: var(--glass);
      flex: 0 0 38px
    }

    input[type=checkbox] {
      width: 18px;
      height: 18px
    }

    .label {
      flex: 1
    }

    .label .title {
      font-weight: 600
    }

    .label .sub {
      font-size: 12px;
      color: var(--muted)
    }

    .done .title {
      text-decoration: line-through;
      color: var(--muted)
    }

    .footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .small {
      font-size: 13px;
      color: var(--muted)
    }

    /* responsive spacing for mobile */
    @media (max-width:420px) {
      .wrap {
        padding: 12px
      }

      .logo {
        width: 56px;
        height: 56px;
        border-radius: 12px
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="logo" style="color:var(--accent);">
        <svg role="img" aria-labelledby="logoTitle" viewBox="0 0 64 64" width="64" height="64"
          xmlns="http://www.w3.org/2000/svg">
          <title id="logoTitle">Logo — Lista de Supermercado</title>
          <!-- rounded square background -->
          <rect x="0" y="0" width="64" height="64" rx="12" fill="currentColor" />
          <!-- shopping bag icon (white) -->
          <path
            d="M42 24h-3a7 7 0 0 0-14 0h-3a5 5 0 0 0-5 5v14a5 5 0 0 0 5 5h24a5 5 0 0 0 5-5V29a5 5 0 0 0-5-5zM32 20a3 3 0 0 1 3 3h-6a3 3 0 0 1 3-3z"
            fill="#fff" />
          <!-- small accent detail -->
          <circle cx="20" cy="22" r="1.6" fill="#ffffff" opacity="0.08" />
        </svg>
      </div>
      <div>
        <h1>Lista de Supermercado</h1>
        <p class="lead">Toca para marcar como completado — se guarda en tu teléfono</p>
      </div>
    </div>

    <div class="card">
      <div class="controls">
        <button id="markAll" class="muted">Marcar todo</button>
        <button id="reloadBtn">Recargar</button>
        <button id="unmarkAll" class="muted">Desmarcar todo</button>
        <button id="clearDone">Borrar completados</button>
        <button id="exportBtn" class="accent">Exportar</button>
      </div>

      <ul id="list" class="checklist" aria-live="polite">
        <!-- items inserted by JS -->
      </ul>
      <!-- New features: cost field + delete button -->

      <div class="footer">
        <div class="small">Guardado localmente en este dispositivo</div>
        <div><button id="addBtn">+ Añadir</button></div>

      </div>
    </div>
  </div>

  <script>
    // Items based on receipt (user's list). Edit here if you want to change defaults.

    const DEFAULT_ITEMS = [
      { title: 'Zucchini' },
      { title: 'Brócoli Mixto' },
      { title: 'Ejote Francés' },
      { title: 'Tomate en Red' },
      { title: 'Chile Verde en Red' },
      { title: 'Cebolla Blanca en Red' },
      { title: 'Maní Chile Limón' },
      { title: 'Queso Morolique' },
      { title: 'Queso Crema Dos Pinos Grande' },
      { title: 'Crema Lactolac 1/4' },
      { title: 'Jamón Pastel Danny' },
      { title: 'Mortadela Jamonada' },
      { title: 'Salchicha de Pavo' },
      { title: 'Consomé Malher Pollo' },
      { title: 'Ajo Molido' },
      { title: 'Carne Molida Súper Especial' },
      { title: 'Carne para Chicharrón' },
      { title: 'Pechugas con hueso' },
      { title: 'Muslo Pierna de Pollo' },
      { title: 'Patties de Pollo Franks' },
      { title: 'Chorizo Mexicano Danny' },
      { title: 'Huevos (60)' },
      { title: 'Frijol Rojo Volteado' },
      { title: 'Arroz Libra' },
      { title: 'Azucar Libra' },
      { title: 'Cafe En Grano' },
      { title: 'Gelatina Vivo' },
      { title: 'Sal Refinada' },
      { title: 'Aceite Danny' },
      { title: 'Mostaza Del Chef' },
      { title: 'Galletas Lolas' },
      { title: 'Leche en Polvo Familiar' },
      { title: 'Mayonesa Del Chef' },
      { title: 'Café Instantáneo Selectos' },
      { title: 'Refresco Vivo Sin Azúcar' },
      { title: 'Detergente Líquido Swift' },
      { title: 'Suavitel' },
      { title: 'Lavaplatos Selectos Verde' },
      { title: 'Desinfectante Fabuloso' },
      { title: '4 Pack Jabón de Baño DK12' },
      { title: 'Pasta de Dientes' },
      { title: 'Papel Higiénico Scott 6 Rollos' },
      { title: 'Papel Toalla Elite Grande' },
      { title: 'Coca-Cola Sin Azúcar' },
      { title: 'Chicharrón Diana 45 g' }
    ];


    const KEY = 'grocery_checklist_v1_milton';
    const listEl = document.getElementById('list');
    const markAll = document.getElementById('markAll');
    const unmarkAll = document.getElementById('unmarkAll');
    const clearDone = document.getElementById('clearDone');
    const exportBtn = document.getElementById('exportBtn');
    const addBtn = document.getElementById('addBtn');
        const reloadBtn = document.getElementById('reloadBtn');


    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          return JSON.parse(raw);
        }
      } catch (e) { console.error(e) }
      return DEFAULT_ITEMS.map(i => ({ ...i, done: false }));
    }

    function save(items) {
      localStorage.setItem(KEY, JSON.stringify(items));
    }

    function render() {
      const items = load();
      listEl.innerHTML = '';
      items.forEach((it, idx) => {
        const li = document.createElement('li'); li.className = 'item' + (it.done ? ' done' : '');
        const box = document.createElement('label'); box.className = 'checkbox';
        const chk = document.createElement('input'); chk.type = 'checkbox'; chk.checked = !!it.done; chk.dataset.idx = idx;
        box.appendChild(chk);
        const lbl = document.createElement('div'); lbl.className = 'label';
        const title = document.createElement('div'); title.className = 'title'; title.textContent = it.title;
        lbl.appendChild(title);
        li.appendChild(box);
        li.appendChild(lbl);
        listEl.appendChild(li);

        chk.addEventListener('change', e => {
          const i = parseInt(e.target.dataset.idx, 10);
          items[i].done = e.target.checked;
          save(items);
          render();
        });

        // allow tap the row to toggle
        li.addEventListener('click', ev => {
          if (ev.target.tagName.toLowerCase() === 'input') return;
          const i = idx;
          items[i].done = !items[i].done;
          save(items);
          render();
        });
      });
    }

    markAll.addEventListener('click', () => {
      const items = load(); items.forEach(i => i.done = true); save(items); render();
    });
    unmarkAll.addEventListener('click', () => { const items = load(); items.forEach(i => i.done = false); save(items); render(); });
    clearDone.addEventListener('click', () => { const items = load(); const left = items.filter(i => !i.done); save(left); render(); });

    exportBtn.addEventListener('click', () => {
      const items = load();
      const txt = items.map(i => (i.done ? '[x] ' : '[ ] ') + i.title).join('\n');
      const blob = new Blob([txt], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'lista_supermercado.txt'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });

    addBtn.addEventListener('click', () => {
      const name = prompt('Añadir producto:');
      if (name && name.trim()) { const items = load(); items.push({ title: name.trim(), done: true }); save(items); render(); }
    });

    function reloadDefaults() {
  // 1. Borrar almacenamiento local por completo
  localStorage.removeItem(KEY);

  // 2. Guardar DEFAULT_ITEMS frescos
  const fresh = DEFAULT_ITEMS.map(i => ({ ...i, done: false }));
  save(fresh);

  // 3. Volver a dibujar la lista
  render();

  alert("Lista restaurada desde los valores por defecto ✔️");
}

    
    // initial render
    render();
    
    reloadBtn.addEventListener('click', reloadDefaults);
    // friendly hint for mobile: preserve orientation and iOS-ish feel
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      console.log('iOS device detected — add to Home Screen for quick access');

    }
  </script>
</body>

</html>
