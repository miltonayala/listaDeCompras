<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lista de Supermercado — Milton</title>
  <style>
    :root{
      --bg:#f2f2f6; --card:#ffffff; --muted:#8e8e93; --accent:#007aff; --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont; background:var(--bg);}
    .wrap{max-width:820px;margin:auto;padding:16px}
    ul{list-style:none;padding:0;margin:0}
    .item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#fff;margin-bottom:10px;position:relative}
    .title{font-weight:600}
    .done .title{text-decoration:line-through;color:var(--muted)}
    .cost{width:70px;border:1px solid #ddd;border-radius:8px;padding:4px}
    .menu-btn{margin-left:auto; background:#eee;padding:6px 10px;border-radius:8px;cursor:pointer}
    .menu{display:none;position:absolute;right:12px;top:48px;background:#fff;border:1px solid #ccc;border-radius:10px;padding:8px;z-index:50}
    .menu.show{display:block}
    #total{font-size:18px;font-weight:700;margin-top:20px;text-align:right}
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Lista de Supermercado</h2>
    <button id="addItem">Añadir producto</button>
    <ul id="list"></ul>
    <div id="total">Total: $0.00</div>
  </div>

<script>
const KEY='grocery_v2';
// preload items restored
const PRELOADED=[
  {title:'Cereal Básico Dany B',done:false,cost:0},
  {title:'Azúcar blanca',done:false,cost:0},
  {title:'Café Selectos Gourmet',done:false,cost:0},
  {title:'Café instantáneo',done:false,cost:0},
  {title:'Consomé Mahler Pollo',done:false,cost:0},
  {title:'Refresco Vivo sin azúcar',done:false,cost:0},
  {title:'Vinagre blanco',done:false,cost:0},
  {title:'Galleta Picnic',done:false,cost:0},
  {title:'Queso Morolique',done:false,cost:0},
  {title:'Huevo Selectos',done:false,cost:0},
  {title:'Carne molida dorada',done:false,cost:0},
  {title:'Carne molida especial',done:false,cost:0},
  {title:'Chorizo argentino',done:false,cost:0},
  {title:'Pollo (muslo/tierna selecta)',done:false,cost:0},
  {title:'Salchicha de pavo',done:false,cost:0},
  {title:'Jamón de pierna',done:false,cost:0},
  {title:'Mortadela familiar',done:false,cost:0},
  {title:'Posta negra',done:false,cost:0},
  {title:'Zucchini',done:false,cost:0},
  {title:'Brócoli mixto bandeja',done:false,cost:0},
  {title:'Detergente líquido',done:false,cost:0},
  {title:'Desinfectante Fabuloso',done:false,cost:0},
  {title:'Lavaplatos',done:false,cost:0},
  {title:'Toallas de cocina / papel toalla Elite',done:false,cost:0},
  {title:'Papel higiénico',done:false,cost:0},
  {title:'Jabón Protex',done:false,cost:0},
  {title:'Crema dental Colgate',done:false,cost:0},
  {title:'Escabeche de vegetales',done:false,cost:0},
  {title:'Mayonesa del Chef',done:false,cost:0},
  {title:'Bebida instantánea en polvo',done:false,cost:0},
  {title:'6 pack Coca-Cola',done:false,cost:0},
  {title:'Sal molida',done:false,cost:0},
  {title:'Aceite de soya y palma',done:false,cost:0},
  {title:'Sazonadores (tomate dulce Badia, chile limón, etc.)',done:false,cost:0},
  {title:'Margarina Dany Vegana',done:false,cost:0}
];

let items=load()();

function load(){return JSON.parse(localStorage.getItem(KEY)||'[]')}
function save(){localStorage.setItem(KEY,JSON.stringify(items))}

function render(){
  const ul=document.getElementById('list');
  ul.innerHTML='';
  items.forEach((it,i)=>{
    const li=document.createElement('li'); li.className='item'+(it.done?' done':'');

    const chk=document.createElement('input'); chk.type='checkbox'; chk.checked=it.done;
    chk.onchange=()=>{it.done=chk.checked; save(); render()};
    li.appendChild(chk);

    const title=document.createElement('div'); title.className='title'; title.textContent=it.title;
    li.appendChild(title);

    const cost=document.createElement('input'); cost.className='cost'; cost.placeholder='$'; cost.value=it.cost||'';
    cost.oninput=()=>{it.cost=parseFloat(cost.value)||0; save(); updateTotal()};
    li.appendChild(cost);

    const btn=document.createElement('div'); btn.className='menu-btn'; btn.textContent='⋯';
    btn.onclick=()=> menu.classList.toggle('show');
    li.appendChild(btn);

    const menu=document.createElement('div'); menu.className='menu';
    const del=document.createElement('div'); del.textContent='Eliminar'; del.style.cursor='pointer'; del.onclick=()=>{items.splice(i,1); save(); render()};
    menu.appendChild(del);
    li.appendChild(menu);

    ul.appendChild(li);
  });
  updateTotal();
}

function updateTotal(){
  const total=items.reduce((s,it)=>s+(parseFloat(it.cost)||0),0);
  document.getElementById('total').textContent='Total: $'+total.toFixed(2);
}

document.getElementById('addItem').onclick=()=>{
  const name=prompt('Nombre del producto:');
  if(name){ items.push({title:name,done:false,cost:0}); save(); render(); }
};

render();
</script>
</body>
</html>
